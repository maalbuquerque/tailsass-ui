name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          path: tailsass-ui

      - name: Checkout Tailsass
        uses: actions/checkout@v4
        with:
          repository: maalbuquerque/tailsass
          path: tailsass

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tailsass/package-lock.json
            tailsass-ui/package-lock.json
            tailsass-ui/website/package-lock.json

      - name: Install and build Tailsass
        working-directory: tailsass
        run: |
          npm ci
          npm run build

      - name: Install and build UI
        working-directory: tailsass-ui
        run: |
          npm ci
          npm run build
          npm run build:min

      - name: Install website deps
        working-directory: tailsass-ui/website
        run: npm ci

      - name: Build website
        working-directory: tailsass-ui/website
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tailsass-ui/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
